<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#16233F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1626" media="(prefers-color-scheme: dark)" />

    <!-- Theme before first paint: the saved choice (kps-theme), else the system setting. -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('kps-theme');
        } catch (e) {}
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
        // The browser bar follows the shown theme, also when it differs from the system one.
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', dark ? '#0E1626' : '#16233F');
      })();
    </script>

    <!-- Per-page title, description, canonical, hreflang, Open Graph, Twitter tags,
         JSON-LD and the html lang attribute are set by src/components/SEO.tsx at build
         time from src/data/canon.ts. -->

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts are self-hosted: src/styles/fonts.css (Inter, Manrope), Noto Sans SC on /zh/ only. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
